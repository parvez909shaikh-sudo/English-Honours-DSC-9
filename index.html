<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>PZ Study</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>

  <!-- ==============================
       HEADER
  =============================== -->

  <header class="top-header">

    <div class="brand">

      <div class="brand-logo">
        PZ
      </div>

      <div class="brand-text">

        <div class="brand-name">
          PZ Study
        </div>

        <div class="brand-subtitle">
          English Honours
        </div>

      </div>

    </div>


    <div class="header-actions">

      <button
        id="menuButton"
        class="header-button"
        type="button"
        aria-label="Open menu"
      >

        <svg viewBox="0 0 24 24">

          <path d="M4 7H20"></path>
          <path d="M4 12H20"></path>
          <path d="M4 17H20"></path>

        </svg>

      </button>


      <button
        id="notificationButton"
        class="header-button notification-button"
        type="button"
        aria-label="Notifications"
      >

        <svg viewBox="0 0 24 24">

          <path
            d="M6 17H18"
          ></path>

          <path
            d="M8 17V10C8 7.8 9.8 6 12 6C14.2 6 16 7.8 16 10V17"
          ></path>

          <path
            d="M10 20H14"
          ></path>

        </svg>

        <span class="notification-dot"></span>

      </button>

    </div>

  </header>



  <!-- ==============================
       NOTIFICATION PANEL
  =============================== -->

  <div
    id="notificationPanel"
    class="notification-panel"
  >

    <div class="notification-header">

      <strong>
        Notifications
      </strong>

      <button
        id="closeNotificationButton"
        type="button"
      >
        ×
      </button>

    </div>

    <div class="notification-body">

      <p>
        Welcome to PZ Study.
      </p>

      <p>
        New English Honours resources will be added gradually.
      </p>

    </div>

  </div>



  <!-- ==============================
       SIDE MENU
  =============================== -->

  <div
    id="menuOverlay"
    class="menu-overlay"
  ></div>


  <aside
    id="sideMenu"
    class="side-menu"
  >

    <div class="side-menu-header">

      <strong>
        PZ Study
      </strong>

      <button
        id="closeMenuButton"
        type="button"
      >
        ×
      </button>

    </div>


    <button
      type="button"
      onclick="navigate('home')"
    >
      Home
    </button>


    <button
      type="button"
      onclick="navigate('honours-hub')"
    >
      English Honours
    </button>


    <button
      type="button"
      onclick="navigate('syllabus')"
    >
      Syllabus
    </button>


    <button
      type="button"
      onclick="navigate('pyq')"
    >
      Previous Year Questions
    </button>


    <button
      type="button"
      onclick="navigate('classes')"
    >
      Free Classes
    </button>

  </aside>



  <!-- ==============================
       MAIN CONTENT
  =============================== -->

  <main id="mainContent"></main>



  <!-- ==============================
       BOTTOM NAVIGATION
  =============================== -->

  <nav class="bottom-nav">

    <button
      id="navHome"
      class="bottom-nav-item"
      type="button"
      onclick="navigate('home')"
    >

      <svg viewBox="0 0 24 24">

        <path
          d="M4 11L12 4L20 11"
        ></path>

        <path
          d="M6 10V20H18V10"
        ></path>

        <path
          d="M10 20V14H14V20"
        ></path>

      </svg>

      <span>
        Home
      </span>

    </button>



    <button
      id="navHonours"
      class="bottom-nav-item"
      type="button"
      onclick="navigate('honours-hub')"
    >

      <svg viewBox="0 0 24 24">

        <path
          d="M4 5H20V19H4Z"
        ></path>

        <path
          d="M8 9H16"
        ></path>

        <path
          d="M8 13H16"
        ></path>

      </svg>

      <span>
        Honours
      </span>

    </button>



    <button
      id="navPYQ"
      class="bottom-nav-item"
      type="button"
      onclick="navigate('pyq')"
    >

      <svg viewBox="0 0 24 24">

        <path
          d="M6 4H18V20H6Z"
        ></path>

        <path
          d="M9 8H15"
        ></path>

        <path
          d="M9 12H15"
        ></path>

        <path
          d="M9 16H13"
        ></path>

      </svg>

      <span>
        PYQ
      </span>

    </button>



    <button
      id="navClasses"
      class="bottom-nav-item"
      type="button"
      onclick="navigate('classes')"
    >

      <svg viewBox="0 0 24 24">

        <rect
          x="3"
          y="5"
          width="18"
          height="13"
          rx="2"
        ></rect>

        <path
          d="M9 21H15"
        ></path>

        <path
          d="M12 18V21"
        ></path>

        <path
          d="M10 9L15 11.5L10 14V9Z"
        ></path>

      </svg>

      <span>
        Classes
      </span>

    </button>

  </nav>



  <script src="app.js"></script>

</body>

</html>
